<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0b0d12;
      color: #f5f7fa;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    h1, h2, p {
      margin-top: 0;
    }

    .date {
      color: #8e96a3;
      margin-top: 6px;
    }

    .card {
      background: #141820;
      border: 1px solid #232936;
      border-radius: 20px;
      padding: 24px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .calories {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 12px solid #303744;
      flex-shrink: 0;
    }

    .circle strong {
      font-size: 36px;
    }

    .circle span {
      color: #8e96a3;
      font-size: 14px;
    }

    .remaining {
      color: #8e96a3;
      font-size: 15px;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      background: #0f1218;
      border-radius: 14px;
      padding: 16px;
    }

    .stat span {
      display: block;
      color: #8e96a3;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 20px;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      background: #f5f7fa;
      color: #0b0d12;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #252b36;
      color: white;
    }

    .danger {
      background: #5a2025;
      color: white;
    }

    .food {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #232936;
    }

    .food:last-child {
      border-bottom: 0;
    }

    .food-name {
      font-weight: 600;
    }

    .food-type {
      color: #8e96a3;
      font-size: 13px;
      margin-top: 4px;
    }

    .food-calories {
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      color: #8e96a3;
      text-align: center;
      padding: 35px 10px;
    }

    .login-box {
      max-width: 450px;
      margin: 80px auto;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #303744;
      background: #0f1218;
      color: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #6d7685;
    }

    label {
      display: block;
      color: #8e96a3;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .message {
      margin-top: 12px;
      color: #8e96a3;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 750px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .calories {
        flex-direction: column;
        text-align: center;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- CONNEXION -->
  <main id="authScreen" class="app">

    <div class="card login-box">

      <h1>Calorie Tracker</h1>

      <p style="color:#8e96a3">
        Ton suivi alimentaire, ton poids et ta progression,
        sauvegardés dans le cloud.
      </p>

      <div class="form-group">
        <label>Email</label>
        <input id="email" type="email" placeholder="ton@email.com">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input id="password" type="password" placeholder="Mot de passe">
      </div>

      <div class="top-buttons">
        <button onclick="signIn()">Se connecter</button>
        <button class="secondary" onclick="signUp()">Créer un compte</button>
      </div>

      <div id="authMessage" class="message"></div>

    </div>

  </main>


  <!-- APPLICATION -->
  <main id="appScreen" class="app hidden">

    <header>

      <div>
        <h1>Calorie Tracker</h1>
        <div class="date" id="today"></div>
      </div>

      <div class="top-buttons">
        <button class="secondary" onclick="addFood()">+ Aliment</button>
        <button class="danger" onclick="signOut()">Déconnexion</button>
      </div>

    </header>


    <section class="dashboard">

      <div class="card">

        <div class="calories">

          <div class="circle">
            <strong id="caloriesConsumed">0</strong>
            <span>kcal</span>
          </div>

          <div>

            <h2 id="goalText">
              Objectif : 2 000 kcal
            </h2>

            <div class="remaining" id="remaining">
              2 000 kcal restantes
            </div>

          </div>

        </div>

        <div class="stats">

          <div class="stat">
            <span>Protéines</span>
            <strong id="protein">0 g</strong>
          </div>

          <div class="stat">
            <span>Glucides</span>
            <strong id="carbs">0 g</strong>
          </div>

          <div class="stat">
            <span>Lipides</span>
            <strong id="fat">0 g</strong>
          </div>

        </div>

      </div>


      <div class="card">

        <h2>Ajouter un aliment</h2>

        <div class="form-group">
          <label>Nom</label>
          <input id="foodName" type="text" placeholder="Ex : Poulet">
        </div>

        <div class="form-group">
          <label>Calories</label>
          <input id="foodCalories" type="number" placeholder="Ex : 450">
        </div>

        <div class="form-group">
          <label>Repas</label>
          <select id="mealType">
            <option value="breakfast">Petit-déjeuner</option>
            <option value="lunch">Déjeuner</option>
            <option value="dinner">Dîner</option>
            <option value="snack">Collation</option>
          </select>
        </div>

        <button onclick="addFood()">
          Ajouter
        </button>

        <div id="foodMessage" class="message"></div>

      </div>

    </section>


    <section class="card section">

      <div class="section-title">
        <h2>Journal alimentaire</h2>
      </div>

      <div id="foodList" class="empty">
        Chargement...
      </div>

    </section>

  </main>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://zyhmobkwwzneeslbjrfc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_-dfC1QExjBlXoHxfLlWGxQ_2d0714Mw";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     DATE
  ========================= */

  const today = new Date();

  const todayString =
    today.toISOString().split("T")[0];

  document.getElementById("today").textContent =
    today.toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });


  /* =========================
     AUTH
  ========================= */

  async function signUp() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showAuthMessage("Remplis ton email et ton mot de passe.");
      return;
    }

    const { error } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {
      showAuthMessage(error.message);
      return;
    }

    showAuthMessage(
      "Compte créé. Vérifie ton email si Supabase te le demande."
    );
  }


  async function signIn() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showAuthMessage("Remplis ton email et ton mot de passe.");
      return;
    }

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      showAuthMessage(error.message);
      return;
    }

    await loadApp();
  }


  async function signOut() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("appScreen")
      .classList.add("hidden");

    document
      .getElementById("authScreen")
      .classList.remove("hidden");
  }


  function showAuthMessage(message) {

    document.getElementById("authMessage").textContent =
      message;
  }


  /* =========================
     APPLICATION
  ========================= */

  async function loadApp() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      document
        .getElementById("appScreen")
        .classList.add("hidden");

      document
        .getElementById("authScreen")
        .classList.remove("hidden");

      return;
    }

    document
      .getElementById("authScreen")
      .classList.add("hidden");

    document
      .getElementById("appScreen")
      .classList.remove("hidden");

    await loadSettings(user);
    await loadFoods(user);
  }


  /* =========================
     SETTINGS
  ========================= */

  async function loadSettings(user) {

    let { data, error } =
      await supabaseClient
        .from("user_settings")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {
      console.error(error);
      return;
    }

    if (!data) {

      const { data: created, error: createError } =
        await supabaseClient
          .from("user_settings")
          .insert({
            user_id: user.id,
            daily_calorie_goal: 2000
          })
          .select()
          .single();

      if (createError) {
        console.error(createError);
        return;
      }

      data = created;
    }

    document.getElementById("goalText").textContent =
      "Objectif : " +
      data.daily_calorie_goal.toLocaleString("fr-FR") +
      " kcal";

    window.dailyGoal =
      data.daily_calorie_goal;
  }


  /* =========================
     ALIMENTS
  ========================= */

  async function loadFoods(user) {

    const { data, error } =
      await supabaseClient
        .from("food_entries")
        .select("*")
        .eq("user_id", user.id)
        .eq("consumed_at", todayString)
        .order("created_at", {
          ascending: true
        });

    if (error) {
      console.error(error);
      return;
    }

    let calories = 0;
    let protein = 0;
    let carbs = 0;
    let fat = 0;

    const list =
      document.getElementById("foodList");

    if (!data || data.length === 0) {

      list.innerHTML =
        "Aucun aliment enregistré aujourd'hui.";

    } else {

      list.innerHTML = "";

      data.forEach(food => {

        calories += Number(food.calories) || 0;
        protein += Number(food.protein_g) || 0;
        carbs += Number(food.carbs_g) || 0;
        fat += Number(food.fat_g) || 0;

        const row =
          document.createElement("div");

        row.className = "food";

        row.innerHTML = `
          <div>
            <div class="food-name">
              ${escapeHtml(food.food_name)}
            </div>

            <div class="food-type">
              ${mealName(food.meal_type)}
            </div>
          </div>

          <div class="food-calories">
            ${food.calories} kcal
          </div>
        `;

        list.appendChild(row);
      });
    }

    document.getElementById("caloriesConsumed").textContent =
      calories.toLocaleString("fr-FR");

    document.getElementById("protein").textContent =
      Math.round(protein) + " g";

    document.getElementById("carbs").textContent =
      Math.round(carbs) + " g";

    document.getElementById("fat").textContent =
      Math.round(fat) + " g";

    const goal =
      window.dailyGoal || 2000;

    const remaining =
      goal - calories;

    document.getElementById("remaining").textContent =
      remaining >= 0
        ? remaining.toLocaleString("fr-FR") + " kcal restantes"
        : Math.abs(remaining).toLocaleString("fr-FR") + " kcal au-dessus de l'objectif";
  }


  async function addFood() {

    const name =
      document.getElementById("foodName").value.trim();

    const calories =
      Number(document.getElementById("foodCalories").value);

    const meal =
      document.getElementById("mealType").value;

    if (!name || !calories || calories < 0) {

      document.getElementById("foodMessage").textContent =
        "Entre un aliment et un nombre de calories valide.";

      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const { error } =
      await supabaseClient
        .from("food_entries")
        .insert({
          user_id: user.id,
          consumed_at: todayString,
          meal_type: meal,
          food_name: name,
          quantity: 1,
          unit: "portion",
          calories: Math.round(calories)
        });

    if (error) {

      console.error(error);

      document.getElementById("foodMessage").textContent =
        "Erreur : " + error.message;

      return;
    }

    document.getElementById("foodName").value = "";
    document.getElementById("foodCalories").value = "";

    document.getElementById("foodMessage").textContent =
      "Aliment ajouté.";

    await loadFoods(user);
  }


  /* =========================
     UTILITAIRES
  ========================= */

  function mealName(type) {

    const names = {
      breakfast: "Petit-déjeuner",
      lunch: "Déjeuner",
      dinner: "Dîner",
      snack: "Collation",
      other: "Autre"
    };

    return names[type] || "Autre";
  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  /* =========================
     INITIALISATION
  ========================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (session) {
        await loadApp();
      } else {

        document
          .getElementById("appScreen")
          .classList.add("hidden");

        document
          .getElementById("authScreen")
          .classList.remove("hidden");
      }
    }
  );


  loadApp();

</script>

</body>
</html>
